[build-system]
requires = [ "setuptools",]
build-backend = "setuptools.build_meta"

[project]
name = "face_attributes"
readme = "README.md"
dynamic = [ "dependencies", "version",]

[project.scripts]
face-attributes = "face_attributes.__main__:main"

[tool.kedro]
package_name = "face_attributes"
project_name = "face_attributes"
kedro_init_version = "1.4.0"
tools = [ "None",]
example_pipeline = "False"
source_dir = "src"

[project.entry-points."kedro.hooks"]

[tool.setuptools.dynamic.dependencies]
file = "requirements.txt"

[tool.setuptools.dynamic.version]
attr = "face_attributes.__version__"

[tool.setuptools.packages.find]
where = [ "src",]
namespaces = false

[tool.kedro_telemetry]
project_id = "521ca7e612a24422852e235a22a112cf"
